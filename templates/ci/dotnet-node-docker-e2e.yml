name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_job:
    name: Skip duplicate runs
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - id: skip
        uses: ./.github/actions/skip-duplicate-run

  backend:
    name: Backend tests
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run backend tests
        run: dotnet test {{BACKEND_TEST_PROJECT}} --configuration Release

      - name: Audit backend packages
        run: dotnet list {{BACKEND_PROJECT}} package --vulnerable --include-transitive

  frontend:
    name: Frontend tests and build
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "{{FRONTEND_DIR}}/package-lock.json"

      - name: Install frontend dependencies
        working-directory: "{{FRONTEND_DIR}}"
        run: npm ci

      - name: Install Chromium for browser tests
        working-directory: "{{FRONTEND_DIR}}"
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        working-directory: "{{FRONTEND_DIR}}"
        run: npm test

      - name: Run frontend coverage gate
        working-directory: "{{FRONTEND_DIR}}"
        run: npm run test:coverage

      - name: Audit frontend packages
        working-directory: "{{FRONTEND_DIR}}"
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: "{{FRONTEND_DIR}}"
        run: npm run build

  docker-e2e:
    name: Docker smoke and E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    # Nenhum valor abaixo é específico de um projeto: todos vêm de Variables
    # (não sensíveis) ou Secrets (sensíveis) do repositório GitHub, com um
    # valor genérico por omissão via "||" para continuar a funcionar sem
    # nenhuma configuração. Configura em Settings -> Secrets and variables
    # -> Actions (ver README) para usar os valores reais da tua aplicação —
    # nenhuma alteração a este ficheiro é necessária.
    env:
      POSTGRES_DB: ${{ vars.CI_E2E_POSTGRES_DB || 'ci_e2e' }}
      POSTGRES_USER: ${{ vars.CI_E2E_POSTGRES_USER || 'ci_e2e' }}
      POSTGRES_PASSWORD: ${{ secrets.CI_E2E_POSTGRES_PASSWORD || 'ci-e2e-password' }}
      DATABASE_CONNECTION_STRING: ${{ format('Host=db;Port=5432;Database={0};Username={1};Password={2}', vars.CI_E2E_POSTGRES_DB || 'ci_e2e', vars.CI_E2E_POSTGRES_USER || 'ci_e2e', secrets.CI_E2E_POSTGRES_PASSWORD || 'ci-e2e-password') }}
      JWT_SECRET: ${{ secrets.CI_E2E_JWT_SECRET || 'ci-e2e-jwt-secret-key-with-at-least-32-bytes' }}
      JWT_ISSUER: ${{ vars.CI_E2E_JWT_ISSUER || 'ci-e2e' }}
      JWT_AUDIENCE: ${{ vars.CI_E2E_JWT_AUDIENCE || 'ci-e2e' }}
      INITIAL_ADMIN_EMAIL: ${{ vars.CI_E2E_ADMIN_EMAIL || 'e2e-admin@example.test' }}
      INITIAL_ADMIN_PASSWORD: ${{ secrets.CI_E2E_ADMIN_PASSWORD || 'E2e-admin-password-123' }}
      SMTP_SERVER: ${{ vars.CI_E2E_SMTP_SERVER || 'smtp.example.test' }}
      SMTP_PORT: ${{ vars.CI_E2E_SMTP_PORT || '2525' }}
      SMTP_SENDER_EMAIL: ${{ vars.CI_E2E_SMTP_SENDER_EMAIL || 'no-reply@example.test' }}
      SMTP_SENDER_NAME: ${{ vars.CI_E2E_SMTP_SENDER_NAME || 'CI' }}
      SMTP_USERNAME: ${{ vars.CI_E2E_SMTP_USERNAME || 'ci-user' }}
      SMTP_PASSWORD: ${{ secrets.CI_E2E_SMTP_PASSWORD || 'ci-e2e-email-password' }}
      SMTP_ENABLE_SSL: ${{ vars.CI_E2E_SMTP_ENABLE_SSL || 'false' }}
      FIREBASE_PROJECT_ID: ${{ vars.CI_E2E_FIREBASE_PROJECT_ID || '' }}
      E2E_BASE_URL: ${{ vars.CI_E2E_BASE_URL || 'http://localhost:8080' }}
      E2E_ADMIN_EMAIL: ${{ vars.CI_E2E_ADMIN_EMAIL || 'e2e-admin@example.test' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.CI_E2E_ADMIN_PASSWORD || 'E2e-admin-password-123' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "{{FRONTEND_DIR}}/package-lock.json"

      - name: Install frontend dependencies
        working-directory: "{{FRONTEND_DIR}}"
        run: npm ci

      - name: Install Chromium for E2E
        working-directory: "{{FRONTEND_DIR}}"
        run: npx playwright install --with-deps chromium

      - name: Start production Compose stack
        run: docker compose {{COMPOSE_ARGS}} up -d --build

      # Nome do serviço de migração no docker-compose, o endpoint de
      # health-check e o código HTTP esperado vêm todos de Variables do
      # repositório, com um valor genérico por omissão (ver README).
      - name: Wait for database migration
        shell: bash
        env:
          MIGRATE_SERVICE: ${{ vars.CI_E2E_MIGRATE_SERVICE || 'migrate' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            migrate_id="$(docker compose {{COMPOSE_ARGS}} ps -a -q "$MIGRATE_SERVICE")"
            if [ -n "$migrate_id" ]; then
              state="$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$migrate_id")"
              if [ "$state" = "exited:0" ]; then
                exit 0
              fi
              if [[ "$state" == exited:* ]]; then
                docker compose {{COMPOSE_ARGS}} logs "$MIGRATE_SERVICE"
                exit 1
              fi
            fi
            sleep 2
          done
          docker compose {{COMPOSE_ARGS}} ps -a
          exit 1

      - name: Wait for API readiness
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ format('{0}{1}', vars.CI_E2E_BASE_URL || 'http://localhost:8080', vars.CI_E2E_HEALTHCHECK_PATH || '/health') }}
          HEALTHCHECK_STATUS: ${{ vars.CI_E2E_HEALTHCHECK_STATUS || '200' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL" || true)"
            if [ "$status" = "$HEALTHCHECK_STATUS" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time (last status: $status)"
          docker compose {{COMPOSE_ARGS}} ps -a
          exit 1

      - name: Run Docker smoke and E2E tests
        working-directory: "{{FRONTEND_DIR}}"
        run: npm run test:e2e

      - name: Show Compose diagnostics on failure
        if: failure()
        run: docker compose {{COMPOSE_ARGS}} ps -a && docker compose {{COMPOSE_ARGS}} logs --no-color --tail 200

      - name: Stop Compose stack
        if: always()
        run: docker compose {{COMPOSE_ARGS}} down -v
