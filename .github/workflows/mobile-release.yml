name: Mobile Release (Kotlin/Flutter)

# Não reage a "push: tags" porque a tag é criada e empurrada pelo
# versioning.yml usando o GITHUB_TOKEN por omissão — o GitHub Actions
# nunca deixa um push feito com esse token disparar outros workflows
# (proteção contra ciclos infinitos). Em vez disso, arranca quando o
# workflow "Semantic Versioning" termina, e vai buscar sozinho a tag
# mais recente à branch onde ele correu.
on:
  workflow_run:
    workflows: ["Semantic Versioning"]
    types:
      - completed
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      # Procura, na raiz e nas subpastas de primeiro nível, um projeto
      # Gradle/Kotlin (gradlew + settings.gradle[.kts]) ou Flutter
      # (pubspec.yaml com secção flutter: + pasta android/). O instalador
      # só copia este workflow para repositórios onde já detetou um dos
      # dois, mas repete a deteção aqui (barata) como rede de segurança
      # caso a estrutura do repositório mude entretanto.
      - name: Detect mobile project
        id: detect
        shell: bash
        run: |
          shopt -s nullglob
          TYPE="none"
          DIR=""

          for d in . */; do
            d="${d%/}"
            if [ -f "$d/gradlew" ] && { [ -f "$d/settings.gradle.kts" ] || [ -f "$d/settings.gradle" ]; }; then
              TYPE="gradle"
              DIR="$d"
              break
            fi
          done

          if [ "$TYPE" = "none" ]; then
            for d in . */; do
              d="${d%/}"
              if [ -f "$d/pubspec.yaml" ] && [ -d "$d/android" ] && grep -q "^flutter:" "$d/pubspec.yaml"; then
                TYPE="flutter"
                DIR="$d"
                break
              fi
            done
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Detected: type=$TYPE dir=$DIR"

      # A run do "Semantic Versioning" que despoletou isto pode não ter
      # criado nenhuma tag nova (ex. commit sem prefixo reconhecido) — e
      # como este workflow corre de forma assíncrona, é preferível ser
      # idempotente (seguro correr mais que uma vez) a tentar adivinhar
      # com precisão "foi mesmo esta run que criou a tag". Salta o build
      # em dois casos: a Release da tag mais recente já tem um .apk, ou
      # nada mudou dentro da pasta do projeto mobile desde a tag anterior
      # (ex. um commit `fix:`/`docs:` que só mexeu noutra parte do repo —
      # não faz sentido publicar um APK novo sem nenhuma alteração real).
      - name: Determine tag and check if a rebuild is needed
        id: tag
        if: steps.detect.outputs.type != 'none'
        run: |
          git fetch --tags
          LATEST=$(git describe --tags --abbrev=0)
          echo "value=$LATEST" >> "$GITHUB_OUTPUT"

          if gh release view "$LATEST" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
            echo "A release $LATEST já tem um .apk anexado — nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIR="${{ steps.detect.outputs.dir }}"
          PREV=$(git describe --tags --abbrev=0 "${LATEST}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            # Exclui .github (workflows/CI) do diff — sem isto, quando o
            # projeto mobile vive na raiz do repositório (DIR="."), um
            # commit que só mexe num workflow conta sempre como "mudou o
            # projeto", e o build nunca é saltado.
            CHANGED=$(git diff --name-only "$PREV" "$LATEST" -- "$DIR" ':!.github')
            if [ -z "$CHANGED" ]; then
              echo "Nada mudou em $DIR entre $PREV e $LATEST — a saltar build de APK."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type != 'none'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Opcional: só é escrito se o repositório de destino tiver esta
      # secret configurada (nem todos os projetos usam Firebase).
      - name: Decode google-services.json (optional)
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type != 'none'
        run: |
          SECRET="${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_BASE64 }}"
          if [ -z "$SECRET" ]; then
            echo "MOBILE_GOOGLE_SERVICES_JSON_BASE64 não definido, a saltar."
            exit 0
          fi
          DIR="${{ steps.detect.outputs.dir }}"
          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            DEST="$DIR/android/app/google-services.json"
          else
            DEST="$DIR/app/google-services.json"
          fi
          echo "$SECRET" | base64 -d > "$DEST"

      - name: Decode release keystore
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type != 'none'
        run: echo "${{ secrets.MOBILE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Contrato: o signingConfig de release do projeto Gradle/Kotlin tem
      # de ler KEYSTORE_PATH/STORE_PASSWORD/KEY_PASSWORD de variáveis de
      # ambiente (ver README).
      - name: Build signed release APK (Gradle)
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type == 'gradle'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_KEY_PASSWORD }}
        run: |
          cd "${{ steps.detect.outputs.dir }}"
          ./gradlew assembleRelease

      # Contrato: o android/app/build.gradle(.kts) do projeto Flutter tem
      # de ter um signingConfigs.release a ler android/key.properties
      # (ver README) — este passo escreve esse ficheiro a partir dos
      # segredos, mas não cria o signingConfig em si.
      - name: Build signed release APK (Flutter)
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type == 'flutter'
        run: |
          DIR="${{ steps.detect.outputs.dir }}"
          cat > "$DIR/android/key.properties" <<EOF
          storePassword=${{ secrets.MOBILE_KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.MOBILE_KEYSTORE_KEY_PASSWORD }}
          keyAlias=upload
          storeFile=${{ runner.temp }}/release.jks
          EOF
          cd "$DIR"
          flutter pub get
          flutter build apk --release

      - name: Locate built APK
        id: apk
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type != 'none'
        run: |
          DIR="${{ steps.detect.outputs.dir }}"
          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            APK="$DIR/build/app/outputs/flutter-apk/app-release.apk"
          else
            APK=$(find "$DIR" -path '*/build/outputs/apk/release/*.apk' | head -1)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Não encontrei nenhum .apk no sítio esperado." >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this tag
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type != 'none'
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          awk -v ver="## $VERSION " '
            index($0, ver) == 1 { found=1; print; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "$VERSION" > release_notes.md
          fi

      # versioning.yml já criou a Release (sem anexo) antes deste
      # workflow arrancar — anexa-lhe o APK. Só cria a Release de raiz se
      # por algum motivo ela ainda não existir.
      - name: Publish APK to GitHub release
        if: steps.tag.outputs.skip == 'false' && steps.detect.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          APK="${{ steps.apk.outputs.path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file release_notes.md --prerelease
          fi
